<html><head><meta charset="utf-8"><style>body{background:#111;color:#eee;font:11px sans-serif;display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.c{border:1px solid #333}.fig{width:100%;height:auto}.fp-near,.fp-torso{stroke:#f2a33a;stroke-width:5;stroke-linecap:round}.fp-far{stroke:#777;stroke-width:4;stroke-linecap:round}.fp-head{fill:#f2a33a}.fp-floor{stroke:#555}.fp-prop rect{fill:#2a3540}.fp-prop line{stroke:#2a3540;stroke-width:4}.fp-towel{stroke:#7fc4d9;stroke-width:2;fill:none}</style></head><body>
<script src="../src/js/figure.js"></script><script src="../src/data/exercises.js"></script>
<script>for(const e of EXERCISES.filter(e=>["superman","decline_pushup","chair_dip","jump_squat","burpee","mountain_climber","jumping_jack","high_knees","crunch","bicycle_crunch","leg_raise","hollow_hold","shoulder_tap"].includes(e.id))){for(const w of ['A','B']){const s=Figure.staticSvg(e,w);const d=document.createElement('div');d.className='c';d.innerHTML=Figure.svgShell(s.props+s.fig)+`<div>${e.id} ${w}</div>`;document.body.appendChild(d);}}</script></body></html>
