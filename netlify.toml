# SoFitGo — production deploy of a PREBUILT, verified site (no build step on Netlify).
# site/ = build 57f33cce03, built from commit 02f92f7 of fix/default-cuisine (full regression 91/91 on de385b3; code identical, 02f92f7 adds docs only).
# It contains only the public Supabase URL and the publishable key (sofitgo-config.js) — never a secret key.
# A new release replaces site/ in this branch. Netlify builds a deploy for every push to this branch; whether it is
# published depends on the site's auto-publishing setting (when locked, a deploy goes live only via "Publish deploy").
[build]
  publish = "site"
  command = "echo 'SoFitGo prebuilt site — build 57f33cce03 — no build step'"
